<div id="ingredients-priority-wrapper">
  <h2>{{'IngredientsPriority.title' | translate}}</h2>
  <app-autocomplete #autoComplete [maxResults]="50" [placeholder]="('IngredientsPriority.add_ingredient' | translate)"
    [dataProvider]="ingredientDataProvider" (itemSelected)="addIngredient($event); autoComplete.clearValue()">
  </app-autocomplete>
  <div class="list ion-padding-top ion-padding-bottom">
    <ion-reorder-group disabled="false" (ionItemReorder)="reorderItems($event)">
      @for (item of items; track item; let i = $index) {
        <ion-item>
          <ion-reorder slot="start"></ion-reorder>
          <ion-label>
            {{i+1}}. {{item.ingredient?.name}} - {{item.ingredient?.brand}} - {{item.ingredient?.qty}}
          </ion-label>
          <ion-icon name="trash" slot="end" (click)="removeIngredient(item.ingredient)"></ion-icon>
        </ion-item>
      }
    </ion-reorder-group>
  </div>
  <div class="ion-padding">
    <ion-button fill="clear" (click)="close()">{{'IngredientsPriority.cancel' | translate}}</ion-button>
    <ion-button class="ion-float-right" color="primary" (click)="save()">{{'IngredientsPriority.save' | translate}}</ion-button>
  </div>
</div>
