<div id="login-wrapper"><form #accountForm="ngForm" (ngSubmit)="section === 'login' ? login() : signIn()"><div class="ion-padding"><h1>{{('Cookbook.' + (section === 'login' ? 'loginTitle' : 'registerTitle')) | translate}}</h1><p>{{'Cookbook.welcome' | translate}}</p>
@if(error) { <p role="alert" class="account-error">{{error}}</p> }
@if(section === 'signin') { <label for="account-name">{{'Cookbook.displayName' | translate}}</label><input id="account-name" name="name" [(ngModel)]="user.name" autocomplete="name" required><label for="account-nickname">{{'Cookbook.nickname' | translate}}</label><input id="account-nickname" name="nickname" [(ngModel)]="user.nickname" autocomplete="username" required minlength="2" maxlength="40" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]*"><small>{{'Cookbook.nicknameHelp' | translate}}</small> }
<label for="account-email">{{'Cookbook.email' | translate}}</label><input id="account-email" name="email" type="email" [(ngModel)]="user.email" autocomplete="email" required email><label for="account-password">{{'Cookbook.password' | translate}}</label><div class="password-row"><input id="account-password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="user.password" [attr.autocomplete]="section === 'login' ? 'current-password' : 'new-password'" required [minlength]="section === 'signin' ? 8 : 1"><button type="button" (click)="togglePassword()" [attr.aria-label]="('Cookbook.'+(showPassword ? 'hidePassword' : 'showPassword')) | translate">{{('Cookbook.'+(showPassword ? 'hide' : 'show')) | translate}}</button></div>@if(section === 'signin') { <small>{{'Cookbook.passwordHelp' | translate}}</small> }
<button class="account-submit" type="submit" [disabled]="accountForm.invalid || busy">{{('Cookbook.'+(busy ? 'saving' : section === 'login' ? 'login' : 'createAccount')) | translate}}</button><button type="button" (click)="section = section === 'login' ? 'signin' : 'login'; error=''" [disabled]="busy">{{('Cookbook.'+(section === 'login' ? 'createAccount' : 'login')) | translate}}</button><button type="button" (click)="close()" [disabled]="busy">{{'Cookbook.cancel' | translate}}</button></div></form></div>
